<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1640">
  <meta name="description" content="Dirigez un hôtel pour Pokémon : installez vos clients selon leurs goûts et ceux de leurs voisins.">
  <title>PokéMotel</title>
  <meta name="application-name" content="PokéMotel">
  <meta property="og:site_name" content="PokéMotel">
  <meta property="og:title" content="PokéMotel">
  <meta name="google-site-verification" content="PNB4EkfXeprbHltupu0jqE4ZyYXkK34gTWuCMK-Azy8" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="day">
  <div id="sky" class="sky" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud-row">
      <div class="hud-res">
        <span id="clock" class="res clock-chip" data-hint="Heure de l’hôtel (Paris). Les clients paient à minuit et partent à 10h ; les arrivées reprennent à 6h."></span>
        <span class="res coin" data-hint="Argent : payé par vos clients à minuit et à leur départ. Sert à construire, recruter, réparer et payer la taxe."><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffcf3f" stroke="#a8700a" stroke-width="1.4"/><circle cx="12" cy="12" r="6" fill="none" stroke="#e0a91e" stroke-width="1.4"/></svg><b id="money">0</b></span>
        <span class="res gem" data-hint="Gemmes : gagnées avec les missions, les clients ravis et la taxe. Elles servent à acheter en boutique."><svg class="ico" viewBox="0 0 24 24"><path d="M7 4 h10 l4 5 -9 11 -9 -11z" fill="#7fe3ff" stroke="#1b7fa8" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 9 h18 M9.5 4 L12 20 M14.5 4 L12 20" stroke="#1b7fa8" stroke-width="1"/></svg><b id="gems">0</b></span>
        <span class="res fame" data-hint="Prestige : gagné avec les clients ravis, les Stars, les agrandissements et les missions. Il compte pour le classement."><svg class="ico" viewBox="0 0 24 24"><path d="M12 2.8 l2.8 5.8 6.3 .9 -4.6 4.4 1.1 6.3 -5.6 -3 -5.6 3 1.1 -6.3 -4.6 -4.4 6.3 -.9z" fill="#ffd84a" stroke="#b07d0a" stroke-width="1.4"/></svg><b id="prestige">0</b></span>
      </div>
    </div>
    <button id="quest" class="quest-card" hidden></button>
  </header>

  <main id="scene" class="scene">
    <div id="actionbar" class="actionbar"></div>
    <div id="tray" class="tray" hidden></div>
    <div id="world" class="world"><div id="building" class="building"></div></div>
    <div class="zoom-ctl">
      <button id="zoom-in" aria-label="Zoomer" data-hint="Zoomer (ou pincer l’écran)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5 V19 M5 12 H19"/></svg></button>
      <button id="zoom-out" aria-label="Dézoomer" data-hint="Dézoomer"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12 H19"/></svg></button>
      <button id="zoom-fit" aria-label="Tout voir" data-hint="Voir tout l’hôtel"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"/></svg></button>
    </div>
  </main>

  <aside id="side" class="side">
    <section class="side-card" id="side-info"></section>
    <section class="side-card quest-panel" id="side-quest"></section>
    <section class="side-card log-panel"><h3>Journal</h3><ul id="side-log" class="journal mini"></ul></section>
  </aside>

  <div id="hint" class="hint" hidden></div>

  <footer class="dock">
    <nav class="tabbar">
      <button id="tab-journal" class="tab" data-hint="Journal : tout ce qui s’est passé, même en votre absence."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 h10 a2 2 0 0 1 2 2 v12 a2 2 0 0 1 -2 2 H8"/><path d="M7 4 a2 2 0 0 0 -2 2 v1.5 h4 V6 a2 2 0 0 0 -2 -2z"/><path d="M8 20 a2 2 0 0 1 -2 -2 v-1 h9 v1 a2 2 0 0 0 2 2"/><path d="M11 9 h5 M11 12.5 h5"/></svg><span>Journal</span><em id="journal-badge" class="badge" hidden>0</em></button>
      <button id="tab-shop" class="tab" data-hint="Boutique : équipements, cadeaux, déco, payés en gemmes."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9 l1.5 -4.5 h13 L20 9"/><path d="M4 9 h16 a2.5 2.5 0 0 1 -5 0 a2.5 2.5 0 0 1 -5 0 a2.5 2.5 0 0 1 -5 0"/><path d="M5.5 11.5 V20 h13 v-8.5"/><path d="M10 20 v-5 h4 v5"/></svg><span>Boutique</span></button>
      <button id="tab-staff" class="tab" data-hint="Personnel : recruter, placer à la réception, réparer, chouchouter."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20 c0 -4 3 -6.5 7 -6.5 s7 2.5 7 6.5"/><path d="M8.6 4.6 h6.8 l-.8 -2 h-5.2z"/></svg><span>Personnel</span><em id="staff-badge" class="badge info" hidden>0</em></button>
      <button id="tab-friends" class="tab" data-hint="Amis : code ami, classement, visites, Œufs surprise et mur."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5 c0 -3.6 2.7 -5.8 6 -5.8 s6 2.2 6 5.8"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 13.8 c2.8 .2 4.5 2.2 4.5 5.2"/></svg><span>Amis</span><em id="friends-badge" class="badge info" hidden>0</em></button>
      <button id="tab-office" class="tab" data-hint="Bureau : taxe, agrandissement, publicité, réglages, succès, transmission de l’hôtel."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5 V5.5 a1.5 1.5 0 0 1 1.5 -1.5 h3 a1.5 1.5 0 0 1 1.5 1.5 v2"/><path d="M3.5 12.5 h17"/></svg><span>Bureau</span></button>
      <button id="tab-lab" class="tab" data-hint="Labo : arbre de talents, points de recherche."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 V9 L4 19 A1.5 1.5 0 0 0 5.4 21 H18.6 A1.5 1.5 0 0 0 20 19 L15 9 V3"/><path d="M8 3 H16 M6.5 15 H17.5"/></svg><span>Labo</span><em id="lab-badge" class="badge info" hidden>0</em></button>
    </nav>
  </footer>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="ctx" class="ctx" role="menu" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="pointer" class="qpointer" aria-hidden="true" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <noscript>PokéMotel a besoin de JavaScript pour fonctionner.</noscript>
  <script type="module" src="src/client/main.js"></script>
</body>
</html>
