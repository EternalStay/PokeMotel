# Redéploie la fonction Supabase « act » (le serveur du jeu) quand le moteur change.
# Prérequis (une seule fois) : secret de dépôt SUPABASE_ACCESS_TOKEN
#   GitHub › Settings › Secrets and variables › Actions › New repository secret
#   (jeton créé sur https://supabase.com/dashboard/account/tokens).
# Lancement manuel possible : onglet Actions › « Déployer le serveur » › Run workflow.
name: Déployer le serveur

on:
  push:
    branches: [master]
    paths:
      - 'src/engine/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'tools/sync-engine.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: biwenlmxtabconpkblke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copier le moteur pour le serveur
        run: node tools/sync-engine.mjs

      - name: Tests
        run: node --test tests/*.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Déployer la fonction act
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent : ajoutez-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          supabase functions deploy act --project-ref "$PROJECT_REF" --no-verify-jwt
