# Redéploie le serveur Supabase quand le moteur ou la base change :
#   1. applique les nouvelles migrations (supabase/migrations) ;
#   2. redéploie la fonction « act ».
# Secrets de dépôt (GitHub › Settings › Secrets and variables › Actions) :
#   SUPABASE_ACCESS_TOKEN : jeton créé sur https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD  : mot de passe de la base (Supabase › Project Settings › Database),
#                           nécessaire pour appliquer les migrations.
# Lancement manuel possible : onglet Actions › « Déployer le serveur » › Run workflow.
name: Déployer le serveur

on:
  push:
    branches: [master]
    paths:
      - 'src/engine/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'tools/sync-engine.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: biwenlmxtabconpkblke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copier le moteur pour le serveur
        run: node tools/sync-engine.mjs

      - name: Tests
        run: node --test tests/*.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Appliquer les migrations de la base
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secret SUPABASE_DB_PASSWORD absent : migrations non appliquées (ajoutez-le, puis relancez)."
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Déployer la fonction act
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent : ajoutez-le dans Settings › Secrets and variables › Actions."
            exit 1
          fi
          supabase functions deploy act --project-ref "$PROJECT_REF" --no-verify-jwt
