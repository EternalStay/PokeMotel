<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône PokéMotel : l'hôtel de nuit, son enseigne au néon et la réception éclairée. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c8f"/><stop offset=".65" stop-color="#2b1a5c"/><stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0533e"/><stop offset="1" stop-color="#8f3426"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#ffb84a"/>
    </linearGradient>
    <linearGradient id="lobby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d1"/><stop offset="1" stop-color="#ffc766"/>
    </linearGradient>
    <filter id="neon" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="70" cy="80" r="5"/><circle cx="132" cy="44" r="3.5"/><circle cx="446" cy="150" r="4"/><circle cx="40" cy="190" r="3"/></g>
  <path d="M420 40 a40 40 0 1 0 36 60 a32 32 0 1 1 -36 -60z" fill="#ffe9b3"/>

  <!-- Enseigne au néon -->
  <g stroke="#3a2a22" stroke-width="10"><path d="M180 176 V206 M332 176 V206"/></g>
  <rect x="104" y="84" width="304" height="96" rx="22" fill="#1a1030" stroke="#5a3b1d" stroke-width="9"/>
  <g filter="url(#neon)">
    <text x="256" y="153" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62"
      letter-spacing="2" fill="#ffe1f3" stroke="#ff4fb8" stroke-width="3">MOTEL</text>
  </g>
  <g fill="#ffd34d"><circle cx="134" cy="112" r="6"/><circle cx="378" cy="112" r="6"/></g>

  <!-- Façade -->
  <rect x="84" y="206" width="344" height="18" rx="5" fill="#e9c99a" stroke="#4a2418" stroke-width="7"/>
  <rect x="98" y="222" width="316" height="252" fill="url(#brick)" stroke="#4a2418" stroke-width="8"/>
  <g stroke="#4a2418" stroke-width="7">
    <rect x="124" y="244" width="70" height="62" rx="6" fill="url(#win)"/>
    <rect x="221" y="244" width="70" height="62" rx="6" fill="#2a2148"/>
    <rect x="318" y="244" width="70" height="62" rx="6" fill="url(#win)"/>
  </g>
  <g stroke="#4a2418" stroke-width="4" opacity=".55"><path d="M159 246 V304 M353 246 V304 M256 246 V304"/></g>

  <!-- Réception : auvent rayé, grande vitrine éclairée, comptoir et sonnette -->
  <rect x="98" y="324" width="316" height="12" fill="#4a2418"/>
  <path d="M108 336 H404 L392 370 H120z" fill="#fff"/>
  <path d="M146 336 L138 370 M196 336 L190 370 M246 336 L242 370 M296 336 L294 370 M346 336 L346 370" stroke="#e8463a" stroke-width="22"/>
  <path d="M108 336 H404 L392 370 H120z" fill="none" stroke="#4a2418" stroke-width="7" stroke-linejoin="round"/>
  <rect x="122" y="378" width="190" height="96" rx="4" fill="url(#lobby)" stroke="#4a2418" stroke-width="7"/>
  <rect x="140" y="430" width="154" height="44" fill="#8b5a2b" stroke="#4a2418" stroke-width="6"/>
  <path d="M206 430 a12 12 0 0 1 24 0z" fill="#f2c03a" stroke="#5a3a06" stroke-width="4"/>
  <rect x="326" y="384" width="64" height="90" rx="4" fill="#6fa8dc" stroke="#4a2418" stroke-width="7"/>
  <path d="M358 386 V472" stroke="#4a2418" stroke-width="5"/>
  <rect x="76" y="470" width="360" height="14" rx="6" fill="#6b5a46"/>
</svg>
